  <body data-page="contact">
    <a class="skip-link" href="#main">Skip to main content</a>

    <noscript>
      <p class="ns-banner">Some parts of this page need JavaScript. Please enable it to see our address and map.</p>
    </noscript>

    <header id="site-header"></header>

    <main id="main">
      <section class="page-head" id="pageHead"></section>

      <!-- Info cards, hours and map · data from content/site.json -->
      <section class="section" aria-label="How to reach us">
        <div class="container">
          <div class="contact-grid">
            <div class="stack">
              <div id="infoCards" class="info-cards"></div>

              <div id="hours" style="scroll-margin-top: calc(var(--header-h) + 24px)">
                <h2 class="h-card" id="hoursTitle" style="margin-bottom: 0.75rem; font-size: var(--fs-lg)"></h2>
                <div class="hours" id="hoursList"></div>
              </div>
            </div>

            <div class="map-card reveal" id="mapCard">
              <div id="map" class="map" role="application"></div>
              <div class="map__fallback"></div>
              <div class="map-card__foot"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Bio · content/site.json ▸ owner -->
      <section class="section section--alt" aria-labelledby="bioHeading">
        <div class="container">
          <div class="section-head section-head--center" id="bioHead"></div>
          <div id="bio"></div>
        </div>
      </section>

      <!-- Enquiry form · content/contact.json ▸ form -->
      <section class="section" aria-labelledby="formHeading">
        <div class="container">
          <div class="contact-grid">
            <div class="stack" id="formIntro"></div>
            <form class="form" id="enquiryForm" novalidate></form>
          </div>
        </div>
      </section>

      <!-- Policies · content/contact.json ▸ policies -->
      <section
        class="section section--alt"
        id="policiesSection"
        aria-labelledby="polHeading"
        style="scroll-margin-top: calc(var(--header-h) + 24px)"
      >
        <div class="container">
          <div class="section-head section-head--center" id="policiesHead"></div>
          <div id="policies" class="values"></div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

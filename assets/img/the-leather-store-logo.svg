<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">The Leather Store</title>
  <desc id="desc">A glowing black-and-gold wordmark reading The Leather Store with the tagline Label of Luxury.</desc>
  <defs>
    <linearGradient id="tlsGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="18%" stop-color="#FFD98B"/>
      <stop offset="48%" stop-color="#D8A657"/>
      <stop offset="78%" stop-color="#9E6A2F"/>
      <stop offset="100%" stop-color="#F4DE9B"/>
    </linearGradient>
    <linearGradient id="tlsGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6de" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tlsBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.84  0 1 0 0 0.67  0 0 1 0 0.35  0 0 0 0.9 0" result="goldBlur"/>
      <feMerge>
        <feMergeNode in="goldBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tlsSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="720" height="220" rx="26" fill="#080604"/>
  <rect x="16" y="16" width="688" height="188" rx="22" fill="none" stroke="#2E2216" stroke-width="1.4" opacity="0.8"/>
  <path d="M30 42 H690" stroke="url(#tlsGlow)" stroke-width="1.2" opacity="0.2"/>
  <path d="M42 168 H678" stroke="url(#tlsGlow)" stroke-width="1.2" opacity="0.18"/>

  <g filter="url(#tlsSoftShadow)" transform="translate(0 2)">
    <text x="54" y="58" font-size="34" fill="#F8E2AA" font-family="'Brush Script MT','Segoe Script',cursive" letter-spacing="0.02em">The</text>

    <text x="92" y="154" font-size="118" font-weight="700" fill="url(#tlsGold)"
          font-family="Georgia,'Times New Roman',serif" letter-spacing="0.025em" filter="url(#tlsBlur)">LEATHER</text>

    <text x="252" y="188" font-size="44" fill="#F6D596" font-family="'Brush Script MT','Segoe Script',cursive" filter="url(#tlsBlur)">Label of Luxury</text>
    <text x="575" y="188" font-size="46" fill="#F7E7B5" font-family="'Brush Script MT','Segoe Script',cursive" filter="url(#tlsBlur)">Store</text>

    <g transform="translate(556 34)">
      <circle cx="0" cy="0" r="14" fill="#1b140e" stroke="url(#tlsGold)" stroke-width="1.6"/>
      <path d="M-4 -1h8" stroke="#F7E4AE" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M0 -5v8" stroke="#F7E4AE" stroke-width="2.3" stroke-linecap="round"/>
      <path d="M18 -5c1.5 0 2.8 1.3 2.8 2.8 0 1.2-.8 2.3-1.9 2.7l1.5 4.5h-2.1l-1.3-4.1H17v4.1h-1.8V-5zm-.6 2.7h1.1c.7 0 1.2-.4 1.2-1s-.5-1-1.2-1h-1.1z" fill="#F8E2AA" transform="scale(0.72)"/>
      <text x="24" y="5" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#D7B36E">9032507164</text>
    </g>
  </g>
</svg>

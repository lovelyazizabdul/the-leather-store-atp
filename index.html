<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#241812" />
    <meta name="color-scheme" content="light" />

    <!-- Title and description are filled from content/home.json ▸ meta -->
    <title>The Leather Store</title>
    <meta name="description" content="" />
    <link rel="canonical" href="https://www.theleatherstore.example/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Leather Store" />
    <meta property="og:title" content="The Leather Store — Handpicked Leather &amp; Lifestyle" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="assets/img/og-image.svg" />
    <meta property="og:url" content="https://www.theleatherstore.example/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="assets/img/favicon.svg?v=20260829c" type="image/svg+xml" />
    <link rel="mask-icon" href="assets/img/favicon.svg?v=20260829c" color="#241812" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="assets/css/base.css?v=20260829c" />
    <link rel="stylesheet" href="assets/css/components.css?v=20260829c" />
    <link rel="stylesheet" href="assets/css/pages.css?v=20260829c" />
  </head>

  <body data-page="home">
    <a class="skip-link" href="#main">Skip to main content</a>

    <noscript>
      <p class="ns-banner">This catalogue is rendered with JavaScript. Please enable it to browse our collections.</p>
    </noscript>

    <header id="site-header"></header>

    <main id="main">
      <!-- Hero carousel · content/home.json ▸ hero -->
      <section id="hero"></section>

      <!-- Marquee · content/home.json ▸ marquee -->
      <div id="marquee" class="marquee" aria-hidden="true"></div>

      <!-- Value props · content/home.json ▸ values -->
      <section class="section section--tight" aria-label="Why shop with us">
        <div class="container">
          <div id="values" class="values"></div>
        </div>
      </section>

      <!-- Category showcase · content/home.json ▸ categoriesSection -->
      <section class="section section--alt" id="categories" aria-labelledby="catsTitle">
        <div class="container">
          <div class="section-head">
            <div class="section-head__text reveal">
              <span class="eyebrow" id="catsEyebrow"></span>
              <h2 class="h-section" id="catsTitle"></h2>
              <p class="lede" id="catsText"></p>
            </div>
            <a class="link-arrow reveal" id="catsLink" href="categories.html"></a>
          </div>
          <div id="categoryGrid" class="cat-grid"></div>
        </div>
      </section>

      <!-- Full catalog · content/home.json ▸ catalog + content/products.json -->
      <section class="section" id="catalog" aria-labelledby="catalogTitle">
        <div class="container">
          <div class="section-head section-head--center">
            <div class="section-head__text reveal">
              <span class="eyebrow eyebrow--center" id="catalogEyebrow"></span>
              <h2 class="h-section" id="catalogTitle"></h2>
              <p class="lede" id="catalogText"></p>
            </div>
          </div>

          <div id="catalogTabs" class="tabs no-scrollbar" role="tablist" aria-label="Filter the catalog by category"></div>
          <div id="catalogList" style="margin-top: clamp(1.75rem, 1.2rem + 2vw, 3rem)"></div>
        </div>
      </section>

      <!-- Story · content/home.json ▸ story -->
      <section class="section section--alt" aria-label="Our story">
        <div class="container" id="story"></div>
      </section>

      <!-- Testimonials · content/home.json ▸ reviews -->
      <section class="section section--dark" aria-labelledby="revTitle">
        <div class="container">
          <div class="section-head section-head--center">
            <div class="section-head__text">
              <span class="eyebrow eyebrow--center" id="revEyebrow" style="color: var(--c-gold)"></span>
              <h2 class="h-section" id="revTitle"></h2>
            </div>
          </div>
          <div id="reviews" class="quotes"></div>
        </div>
      </section>

      <!-- Visit CTA · content/home.json ▸ visitCta -->
      <section class="section" aria-label="Visit the store">
        <div class="container">
          <div class="cta-band reveal" id="visitCta"></div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="assets/js/content.js?v=20260829c"></script>
    <script src="assets/js/catalog.js?v=20260829c"></script>
    <script src="assets/js/icons.js?v=20260829c"></script>
    <script src="assets/js/media.js?v=20260829c"></script>
    <script src="assets/js/ui.js?v=20260829c"></script>
    <script src="assets/js/modal.js?v=20260829c"></script>
    <script src="assets/js/home.js"></script>
  </body>
</html>
